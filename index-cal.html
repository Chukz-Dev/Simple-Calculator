<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>My Calculator</header>

    <section>
      <p class="js-cal"></p>

    <p>
    <button class="btn" onclick="
    getValue(1);
    ">1</button>

    <button class="btn" onclick="
    getValue(2);
    ">2</button>

    <button class="btn" onclick="
    getValue(3);"
    >3</button>

    <button class="btn1" onclick="
    getValue(' + ');
    ">+</button>
   </p>


    <p>
      <button class="btn" onclick="
      getValue(4);
      ">4</button>

      <button class="btn" onclick="
      getValue(5);
      ">5</button>

      <button class="btn" onclick="
      getValue(6);
      ">6</button>
    
      <button class="btn1" onclick="
      getValue(' - ');
      ">-</button>
    </p>

    <p>
      <button class="btn" onclick="
      getValue(7);
      ">7</button>

      <button class="btn" onclick="
      getValue(8);
      ">8</button>

      <button class="btn" onclick="
      getValue(9);
      ">9</button>

     <button class="btn1" onclick="
      getValue(' * ');
      ">*</button>
    </p>

    <p>
      <button class="btn1" onclick="
      getValue(0);
      ">0</button>

      <button class="btn1" onclick="
      getValue(' . ');
      ">.</button>

      <button class="btn1" onclick=
      "calculation = eval(calculation);
      document.querySelector('.js-cal').innerText = calculation;"
      >=</button>

      <button class="btn1" onclick="
      getValue(' / ');
      ">/</button>
      </p>
    
      <p>
        <button class="btn2" onclick=
          "calculation = ''; 
          document.querySelector('.js-cal').innerText = '0 ';"
      >clear</button>
      </p>
      

    </section>
    

</body>
<script>

  function getValue(value) {
    calculation = calculation + value;
    document.querySelector('.js-cal').innerText = calculation;
  }

 let calculation = ' ';
 
 
</script>
</html>
